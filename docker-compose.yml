services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
    volumes:
      - ./migrations:/migrations
    command: ["--wait", "--no-dump-schema", "--migrations-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["python", "-m", "worker.scheduler"]
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
